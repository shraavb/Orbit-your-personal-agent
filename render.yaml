services:
  # Backend API (Demo Mode)
  - type: web
    name: orbit-demo-backend
    runtime: python
    plan: starter
    branch: demo-dummy
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-demo-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8

databases:
  # PostgreSQL Database (Demo)
  - name: orbit-demo-db
    plan: starter
    databaseName: orbit_demo
    user: orbit
